plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.example.ipt"    // 既存に合わせる
    compileSdk 35

    defaultConfig {
        applicationId "com.example.ipt"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
